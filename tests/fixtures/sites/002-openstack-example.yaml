name: rent
mode: openstack
base_domain: rent.do.top
http: true
https: true
cert_file: tests/fixtures/certs/rent.do.top.crt
key_file: tests/fixtures/certs/rent.do.top.key

firewall_dir: tests/fixtures/firewall

openstack:
  timeout_secs: 5
  cache_ttl_secs: 86400
  auth:
    api_url: https://controller.example.com:5000/v3
    approach: password
    username: proxy
    password: ${OS_PASSWORD}
    project_name: admin
    project_domain_name: Default
    user_domain_name: Default
  nova:
    api_url: https://controller.example.com:8774/v2.1
    all_tenants: true
